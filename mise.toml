# mise is the command surface for this repo: `mise tasks` lists the verbs.

[tasks.check]
description = "Site integrity: every environment's index exists"
run = """
#!/usr/bin/env bash
set -euo pipefail
for d in _www _repo _stay _docs; do
  [ -f "_static/$d/index.html" ] || { echo "check: _static/$d/index.html missing" >&2; exit 1; }
done
echo "check: all four sites intact"
"""

[tools]
node = "24"

[tasks.deploy]
description = "Deploy all four sites at merged main"
confirm = "Deploy all four strapped.sh sites to production?"
timeout = "10m"
usage = 'flag "--dry-run" help="Validate without shipping"'
run = """
#!/usr/bin/env bash
set -euo pipefail
[ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "deploy: refusing — CLOUDFLARE_API_TOKEN is unset" >&2; exit 1; }
[ "$(git rev-parse --git-dir)" = "$(git rev-parse --git-common-dir)" ] || { echo "deploy: refusing — deploy runs only from the main checkout" >&2; exit 1; }
[ -z "$(git status --porcelain)" ] || { echo "deploy: refusing — tree is dirty" >&2; exit 1; }
git fetch -q origin main
# FETCH_HEAD, not origin/main: a CI checkout has no remote-tracking ref.
[ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ] || { echo "deploy: refusing — HEAD is not landed origin/main" >&2; exit 1; }
mise run check
# One worker per env, four hostnames off one source tree.
envs="www repo stay docs"
if [ "${usage_dry_run:-false}" = "true" ]; then
  for e in $envs; do npx wrangler deploy --dry-run --env "$e"; done
  echo "deploy: dry run complete — nothing shipped"
  exit 0
fi
tag="$(git rev-parse --short HEAD)"
message="$(git log -1 --pretty=%s)"
for e in $envs; do
  npx wrangler deploy --env "$e" --tag "$tag" --message "$message"
done
# Cloudflare is the authority on which version serves traffic. The public URL
# cannot answer it: bot protection 403s a datacenter IP on some zones and not
# others, so a status code there means nothing consistent.
python3 - "$tag" $envs <<'VERIFY'
import json, subprocess, sys

def wrangler(*args):
    r = subprocess.run(["npx", "wrangler", *args, "--json"], capture_output=True, text=True)
    if r.returncode:
        sys.exit(f"deploy: {' '.join(args)} failed — {r.stderr.strip()[:200]}")
    return json.loads(r.stdout)

want, envs = sys.argv[1], sys.argv[2:]
for env in envs:
    active = wrangler("deployments", "list", "--env", env)[-1]["versions"][0]["version_id"]
    got = next((v["annotations"].get("workers/tag", "") for v in wrangler("versions", "list", "--env", env) if v["id"] == active), "")
    if got != want:
        sys.exit(f"deploy: refusing — {env} serving {active} carries tag {got!r}, expected {want!r}")
    print(f"deploy: {env} live — {active} serving 100%, tagged {want}")
VERIFY
"""
