# mise is the command surface for this repo: `mise tasks` lists the verbs.

[tasks.setup]
description = "Arm the commit gate"
run = "mise generate git-pre-commit --write --task=pre-commit"

[tasks.check]
description = "Site integrity: every environment's index exists"
run = """
#!/usr/bin/env bash
set -euo pipefail
for d in _www _repo _stay _docs; do
  [ -f "_static/$d/index.html" ] || { echo "check: _static/$d/index.html missing" >&2; exit 1; }
done
echo "check: all four sites intact"
"""

[tasks.pre-commit]
description = "Commit gate: branches author, main never does"
run = """
#!/usr/bin/env bash
set -euo pipefail
[ "$(git branch --show-current)" != "main" ] || { echo "pre-commit: refusing — commits are authored on branches, never on main" >&2; exit 1; }
mise run check
"""
